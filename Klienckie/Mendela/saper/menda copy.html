<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let gameArray = [
            [0, 0, 0],
            [0, 1, 0],
            [0, 0, 0],
        ]
        function init() {
            const container = document.createElement("div");
            container.id = "container";
            const txt = document.createTextNode("Wpisz rozmiar planszy N: ");
            const input = document.createElement("input");
            input.id = 'N'
            const button = document.createElement("button");
            button.innerText = "GENERUJ"
            button.onclick = () => {
                if (!isNaN(input.value))
                    generateArray(input.value);
                else alert("wpisz liczbę");
            }
            document.body.append(txt, input, button, container);
        }
        function generateArray(gridSize) {
            for (let i = 0; i < gridSize; i++) {
                gameArray[i] = []
                for (let j = 0; j < gridSize; j++) {
                    gameArray[i][j] = 0
                }
            }
            shuffleBombs(gridSize, 20); // wartosc z inputa
        }
        function shuffleBombs(gridSize, bombCount) {
            let bombsGenerated = 0;
            while (bombsGenerated < bombCount) {
                const x = Math.floor(Math.random() * gridSize);
                const y = Math.floor(Math.random() * gridSize);
                if (gameArray[y][x] == 0) {
                    gameArray[y][x] = 1;
                    bombsGenerated++;
                }
            }
            generateTable()
        }
        function generateTable() {
            const table = document.createElement("table");
            table.border = "1";
            for (let i = 0; i < gameArray.length; i++) {
                const tr = document.createElement("tr")
                for (let j = 0; j < gameArray[i].length; j++) {
                    const td = document.createElement("td");
                    td.setAttribute("data-x", j);
                    td.setAttribute("data-y", i);
                    td.innerText = gameArray[j][i];
                    td.onclick = function () {
                        console.table(gameArray)
                        console.log(this.dataset.x, this.dataset.y); // <td data-x="" data-y=""
                        this.style.backgroundColor = "pink";
                        const x = parseInt(this.dataset.x)
                        const y = parseInt(this.dataset.y)
                        let counter = 0;
                        for (let i = x - 1; i <= x + 1; i++) {
                            for (let j = y - 1; j <= y + 1; j++) {
                                if (gameArray[i]?.[j] == 1) counter++;
                            }
                        }
                        this.innerText = counter;
                    }
                    tr.append(td);
                }
                table.append(tr);
            }
            document.getElementById("container").append(table)
        }

        init();
    </script>
</body>

</html>
