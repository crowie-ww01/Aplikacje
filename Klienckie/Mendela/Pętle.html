    <h3>3.b</h3>
    <script>

    </script>
    <h3>3.c</h3>
    <script>
        document.write("<pre>")
        document.write(" ".repeat(ile - 1) + "X<br>")
        for (let i = 0; i < (ile - 2); i++) {
            document.write(" ".repeat(ile - i - 2) + "X" + " ".repeat(i) + "X<br>")
        }
        document.write("X".repeat(ile))
        document.write("</pre>")
    </script>
    <h3>3.d</h3>
