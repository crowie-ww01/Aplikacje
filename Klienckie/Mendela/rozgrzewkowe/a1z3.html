    <script>
        let txt = "Ala ma kota, a kot ma Ale"
        function textStats(txt) {
            let slowa = txt.split(" ")
            console.log("slow " + slowa.length)
            let duze = 0
            for (let i = 0; i < slowa.length; i++) {
                if (slowa[i][0] == slowa[i][0].toUpperCase()) {
                    duze += 1
                }
            }
            console.log("z dużej " + duze)

        }
        textStats(txt)
    </script>
