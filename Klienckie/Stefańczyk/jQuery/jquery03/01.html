<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            text-align: center;
        }

        h1 {
            margin: 0;
            color: rgb(87, 164, 228);
        }

        .labyrinth {
            background-color: rgb(91, 102, 122);
            width: 235px;
            height: 235px;
            border-radius: 15px;
            position: relative;
        }

        body {
            display: flex;
            flex-direction: column;
            gap: 30px;
            align-items: center;
            justify-content: center;
            background-color: rgb(22, 28, 41);
            padding: 50px;

        }

        .main {
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
            justify-content: center;
            background-color: rgb(53, 62, 80);
            padding: 40px;
            border-radius: 15px;
        }

        button {
            all: unset;
            width: 130px;
            border-radius: 25px;
            padding: 10px;
            color: white;

        }

        .blue {
            background-color: rgb(87, 164, 228);
        }

        .green {
            background-color: green;
        }

        .red {
            background-color: red;
        }


        .labElements {
            height: 35px;
            width: 35px;
            background-color: rgb(185, 176, 176);
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 5px;
        }

        .chosen {
            background-color: orange;

        }

        .player {
            height: 35px;
            width: 35px;
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 50%;

        }

        #player1 {
            background-color: blueviolet;
        }

        #player2 {
            background-color: rgb(189, 91, 91);

        }
    </style>
</head>

<body>
    <div class="main">
        <div>
            <h1>Labirynt - tablice obiektów</h1>
        </div>
        <div>
            <button class="blue" id="start">START GRY</button>
            <button class="green" id="ruch">RUCH GRACZA</button>
            <button class="red" id="reset">RESETUJ</button>
        </div>
        <div class="labyrinth" id="labyrinth">
            <!-- <div>player 1</div>
            <div>player 2</div> -->
        </div>
        <div id="info"></div>
    </div>
    <script src="../libs/jp.js"></script>
    <script>
        $(document).ready(function () {
            let labyrinth = []
            let position = {
                x: "",
                y: "",
            }
            let gridSize = 50
            // .css("top", i * 50)
            for (let j = 0; j < 5; j++) {
                for (let i = 0; i < 5; i++) {
                    const divEl = $(`<div class='labElements' id='divEl${i}${j}'>`)
                        .css("left", i * gridSize)
                        .css("top", j * gridSize)

                    $("#labyrinth").append(divEl)

                    $(`#divEl${i}${j}`).on("click", function () {
                        $(this).addClass("chosen")
                        position = {}
                        position["x"] = i * gridSize
                        position["y"] = j * gridSize
                        labyrinth.push(position)
                        console.log(labyrinth)
                        $("#info").html(`Labirynt ma ${labyrinth.length} pól`)
                    })

                }
            }
            $("#start").on("click", function () {
                if (labyrinth.length < 3) {
                    $("#info").html(`za mały labirynt. Wybierz co najmniej 3 pola`)
                }
                else {
                    $("#info").html(`Gra rozpoczęta! Gracz 1 zaczyna!`)
                    const player = $(`<div class='player' id='player1'>`)
                        .css("left", labyrinth[0].x)
                        .css("top", labyrinth[0].y)

                    const player2 = $(`<div class='player' id='player2'>`)
                        .css("left", labyrinth[labyrinth.length - 1].x)
                        .css("top", labyrinth[labyrinth.length - 1].y)

                    $("#labyrinth").append(player).append(player2)
                }
            })
            let z = 0

            $('#ruch').on("click", function () {
                z += 1
                if (z < 2 * labyrinth.length - 1) {
                    if (z % 2 != 0) {
                        $("#player1")
                            .css("left", labyrinth[Math.ceil(z / 2)].x)
                            .css("top", labyrinth[Math.ceil(z / 2)].y)
                        $("#info").html(`Ruch gracza 1`)
                        if (Math.ceil(z / 2) == labyrinth.length - 1) {
                            $("#info").html(`koniec gry dla gracza 1`)

                        }
                    }
                    else {
                        $("#player2")
                            .css("left", labyrinth[labyrinth.length - Math.ceil(z / 2) - 1].x)
                            .css("top", labyrinth[labyrinth.length - Math.ceil(z / 2) - 1].y)
                        $("#info").html(`Ruch gracza 2`)
                        if ((labyrinth.length - Math.ceil(z / 2) - 1) == 0) {
                            $("#info").html(`koniec gry dla gracza 2`)

                        }
                    }
                }
            })
            $('#reset').on("click", function () {
                $(".chosen").each(function () {
                    $(this).removeClass("chosen")
                })
                labyrinth = []
                $(".player").each(function () {
                    $(this).remove()
                })
                z = 0
                $("#info").html(``)

            })
        })
    </script>
</body>
<!-- długość do ustanowienia czy mozna zaczac poprzez labyrinth.length -->

</html>
