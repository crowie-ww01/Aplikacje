<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .gen {
            background-color: rgb(201, 201, 201);
            min-width: 800px;
            min-height: 100px;
            border-style: solid;
            border-color: grey;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            gap: 10px;
            /* border-radius: 50%; */
            padding: 20px;
        }

        .choose {
            /* border-radius: 30%;
            border-color: grey;
            border-style: solid;
            border: 3px; */
            background-color: rgb(230, 230, 230);
            padding: 20px;
            border-style: solid;
            border-radius: 10px;
            border-color: rgb(201, 201, 201);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }


        .name {
            background-color: rgb(230, 230, 230);
            border-color: rgb(201, 201, 201);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .tile {
            all: unset;
            border-radius: 15%;
            color: white;
            text-align: center;

        }
    </style>
</head>

<body>
</body>
<div class="main">
    <h1>02 - Generator kafelków, losowość</h1>
    <div class="choose">
        <div class="name">
            Liczba kafelków:
            <select name="" id="count">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
            </select>
        </div>
        <div class="name">
            Rozmiar kafelka:
            <input type="range" name="" id="size" min="50" max="200">
        </div>
        <div class="name">
            Kolor bazowy
            <input type="color" id="color">
        </div>
        <button id="bt-generate">Generuj kafelki</button>
    </div>
    <script src="libs/jp.js"></script>
    <script>
        $("dokument").ready(function () {
            $("#bt-generate").on("click", function () {
                let count = $("#count").val()
                let size = $("#size").val()
                let color = $("#color").val()
                $("#gen").empty()
                // const tiles = []
                for (let i = 1; i <= (count); i++) {
                    const tile = $("<div>")
                    tile.addClass('tile')
                    tile.css("background-color", color)
                    tile.css("width", `${size}px`)
                    tile.css("height", `${size}px`)
                    // tiles.push(tile)

                    // tile.append(i)
                    $("#gen").append(tile)

                    // $("#gen").append(tile.append(i))
                    tile.on("click", function () {

                        // let array = [...tiles]
                        // let array = Array.from(tiles)
                        // let array = tiles.toArray()
                        $(".tile").each(function () {
                            $(this).css("background-color", color)

                        })
                        let colorNumber = Math.round(Math.random() * 16777215)
                        let colorText = "#" + colorNumber.toString(16).padStart(6, "0")
                        tile.css("background-color", colorText)
                    })

                }

            })
        })
    </script>

    <div class="gen" id="gen"></div>
</div>

</html>
