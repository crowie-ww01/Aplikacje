<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .gen {
            background-color: rgb(201, 201, 201);
            min-width: 800px;
            min-height: 100px;
            border-style: solid;
            border-color: grey;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: row;
            gap: 20px;
            /* border-radius: 50%; */
            padding: 20px;

        }

        .choose {
            /* border-radius: 30%;
            border-color: grey;
            border-style: solid;
            border: 3px; */
            background-color: rgb(230, 230, 230);
            padding: 10px;
            border-style: solid;
            border-color: rgb(201, 201, 201);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }


        .square {
            all: unset;
            background-color: rgb(0, 102, 255);
            width: 70px;
            height: 70px;
            border-radius: 15%;
            color: white;
            text-align: center;
        }

        .selected {
            all: unset;
            background-color: orange;
            width: 70px;
            height: 70px;
            border-radius: 15%;
            color: white;
            text-align: center;
        }
    </style>
</head>

<body>
</body>
<div class="main">
    <h1>04 - Pętla for, dynamiczne tworzenie i przemieszczanie elementów</h1>
    <div class="choose">
        <button id="bt-generate">Generuj elementy</button>

        <button id="moveLeftButton">&lt;- W lewo</button>
        <button id="moveRightButton">W prawo -></button>
        <button id="bt-remove">Usuń wszystkie</button>


        <select name="" id="sel">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
        </select>
    </div>
    <script src="libs/jp.js"></script>
    <script>
        $("dokument").ready(function () {
            $("#bt-generate").on("click", function () {
                let x = $("#sel").val()
                $("#gen").empty()
                for (let i = 1; i <= x; i++) {
                    const bt = $("<button class='square'>")
                    $("#gen").append(bt.append(i))
                    bt.on('click', function () {
                        $(".selected").each(function () {
                            $(this).removeClass("selected")
                            $(this).addClass("square")
                        })
                        $(this).removeClass("square")
                        $(this).addClass("selected")
                    })
                }
            })
            $("#moveLeftButton").on("click", function () {
                const prev = $(".selected").prev()
                if (prev.length)
                    prev.before($(".selected"))
            })
            $("#moveRightButton").on("click", function () {
                const next = $(".selected").next()
                if (next.length)
                    next.after($(".selected"))
            })
            $("#bt-remove").on("click", function () {
                $("#gen").empty()
            })

        })
    </script>

    <div class="gen" id="gen"></div>
</div>

</html>
