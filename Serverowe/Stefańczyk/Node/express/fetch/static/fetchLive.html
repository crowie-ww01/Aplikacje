<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .klik {
            background-color: rgb(37, 56, 92);
            width: 60px;
            height: 20px;
            text-align: center;
            color: white;
            padding: 5px;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="main">
        <h1>04 - fetch, ranges</h1>
        <input type="range" id="suwak" min="0" max="10">
        <input type="range" id="mirror" min="0" max="10">

        <script>
            document.getElementById("suwak").oninput = function () {
                const data = JSON.stringify({
                    suwak: document.getElementById("suwak").value,
                })
                const options = {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: data
                };
                fetch("/logs", options)
                    .then(function (response) {
                        return response.json();
                    })
                    .then(function (dataFromServer) {
                        document.getElementById("mirror").value = dataFromServer;
                    })
                    .catch(function (error) {
                        console.log(error);
                    });
            }
        </script>
    </div>
</body>

</html>
